# Ledgerly web server: serves the React build and forwards /api to the API container.
# Runs as a non-root user inside the container, so it listens on 8080 (compose maps it to the host).

server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Docker's built-in DNS. Re-resolving "api" every few seconds lets Nginx survive an API restart.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Used by the container health check.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # REST API. The URI is passed through unchanged (/api/... stays /api/...).
  location /api/ {
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # We are the edge proxy, so we set the client address ourselves instead of trusting an incoming header.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Same id in the Nginx log, the API log and the response header (X-Request-Id).
    proxy_set_header X-Request-Id $request_id;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    client_max_body_size 16k;
  }

  # Hashed build files never change, so browsers can cache them for a year.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
  }

  # The app shell must always be revalidated so new deployments show up immediately.
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }

  # Single-page app: any other path is handled by the router in the browser.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    include /etc/nginx/security-headers.conf;
  }
}
